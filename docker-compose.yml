services:
  python:
    build: ./python
    ports:
      - "8000:8000"
    env_file:
      - ./python/.env
    dns:
      - 8.8.8.8

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - python
